# org.springframework.web is the package where Spring MVC is present
#logging.level.org.springframework = debug
logging.level.org.springframework = INFO

spring.mvc.view.prefix:/WEB-INF/jsp/
spring.mvc.view.suffix:.jsp
logging.level.: DEBUG

# With the latest versions of Spring Boot (2.3+), the H2 database URL is randomly generated
# each time you restart the server. That can be found in the console log.
# To fix that, we can define a URL here.
spring.datasource.url=jdbc:h2:mem:testdb;NON_KEYWORDS=USER,DESC
# By doing this, we can always use the above URL instead of the random URL that is generated from 
# console to access the database.
# NON_KEYWORDS: H2 2.x (Spring Boot 2.7) treats USER and DESC as reserved words, and the Todo
# entity uses both as column names.

# Since Spring Boot 2.5, data.sql runs before Hibernate creates the tables unless this is set.
spring.jpa.defer-datasource-initialization=true

spring.jpa.show-sql = true
spring.h2.console.enabled = true
